name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest -v
      - name: Build twice and compare
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python supply_chain.py build --version 0.0.0 --output first
          python supply_chain.py build --version 0.0.0 --output second
          cmp first/greeter-0.0.0.tar.gz second/greeter-0.0.0.tar.gz
          cmp first/greeter-0.0.0.spdx.json second/greeter-0.0.0.spdx.json
          python supply_chain.py verify first/greeter-0.0.0.tar.gz first/greeter-0.0.0.spdx.json
